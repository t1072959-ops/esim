<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>連線登機證 · eSIM 轉售平台</title>
<style>
  :root{
    --ink:#16233F;
    --ink-soft:#2B3A5C;
    --paper:#F7F5EF;
    --paper-dim:#EDE9DE;
    --gold:#E8A33D;
    --teal:#2F9E8F;
    --red:#C1502E;
    --line: rgba(22,35,63,0.16);
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family: 'Inter', -apple-system, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:var(--ink); }

  /* ---------- HEADER ---------- */
  header{
    padding:28px 6vw 20px;
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--line);
  }
  .logo{ display:flex; align-items:center; gap:10px; }
  .logo-mark{
    width:34px; height:34px; border-radius:8px;
    background:var(--ink);
    position:relative;
  }
  .logo-mark::after{
    content:'';
    position:absolute; inset:8px;
    border:2px solid var(--gold);
    border-radius:3px;
  }
  .logo-text{ font-weight:700; letter-spacing:0.02em; font-size:15px; }
  .logo-text span{ color:var(--teal); }
  nav a{
    color:var(--ink-soft); text-decoration:none; font-size:13.5px;
    margin-left:28px; font-weight:500;
  }
  nav a:hover{ color:var(--gold); }

  /* ---------- HERO ---------- */
  .hero{
    padding:70px 6vw 50px;
    display:grid; grid-template-columns:1.1fr 0.9fr; gap:40px; align-items:center;
  }
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--teal); margin-bottom:14px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:''; width:22px; height:1px; background:var(--teal); }
  h1{
    font-size:clamp(34px,4.2vw,56px); line-height:1.08; margin:0 0 18px;
    font-weight:800; letter-spacing:-0.01em;
  }
  h1 em{ font-style:normal; color:var(--gold); }
  .hero p{ font-size:16px; line-height:1.7; color:var(--ink-soft); max-width:46ch; }
  .hero-actions{ margin-top:28px; display:flex; gap:14px; }
  .btn{
    border:none; cursor:pointer; font-weight:700; font-size:14px;
    padding:14px 24px; border-radius:8px; transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--ink); color:var(--paper); }
  .btn-primary:hover{ box-shadow:0 8px 20px rgba(22,35,63,0.25); }
  .btn-ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--line); }

  /* stub ticket illustration in hero */
  .stub-preview{
    background:var(--ink); border-radius:16px; padding:26px;
    position:relative; overflow:hidden; color:var(--paper);
    box-shadow:0 20px 50px rgba(22,35,63,0.28);
  }
  .stub-preview .row{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; opacity:0.65; text-transform:uppercase; letter-spacing:0.08em;}
  .stub-preview .route{ font-size:30px; font-weight:800; margin:14px 0 4px; letter-spacing:-0.02em;}
  .stub-preview .sub{ font-size:13px; opacity:0.7; margin-bottom:20px;}
  .perf{
    border-top:2px dashed rgba(247,245,239,0.28); margin:18px 0; position:relative;
  }
  .perf::before,.perf::after{
    content:''; position:absolute; top:-11px; width:22px; height:22px; border-radius:50%; background:var(--paper);
  }
  .perf::before{ left:-26px; } .perf::after{ right:-26px; }
  .qr-mock{
    width:86px; height:86px; border-radius:6px; margin-left:auto;
    background:
      repeating-linear-gradient(90deg, var(--paper) 0 6px, transparent 6px 12px),
      repeating-linear-gradient(0deg, var(--paper) 0 6px, transparent 6px 12px);
    background-blend-mode:screen; opacity:0.9;
  }
  .stub-preview .meta{ display:flex; justify-content:space-between; align-items:flex-end; }
  .stub-preview .meta div{ font-family:var(--mono); font-size:11px; opacity:0.6; }
  .stub-preview .meta strong{ display:block; font-size:15px; color:var(--paper); font-family:inherit; opacity:1; }

  /* ---------- REGION TABS ---------- */
  .shop{ padding:20px 6vw 90px; }
  .shop-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:14px;}
  .shop-head h2{ font-size:24px; margin:0; }
  .tabs{ display:flex; gap:8px; }
  .tab{
    font-family:var(--mono); font-size:12.5px; padding:9px 16px; border-radius:20px;
    border:1px solid var(--line); background:transparent; cursor:pointer; color:var(--ink-soft);
    transition:all .15s ease;
  }
  .tab.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:22px; }

  /* ---------- TICKET CARD ---------- */
  .ticket{
    background:#fff; border-radius:14px; overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 2px 0 var(--line);
    display:flex; flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .ticket:hover{ transform:translateY(-4px); box-shadow:0 16px 30px rgba(22,35,63,0.12); }
  .ticket-top{ padding:20px 22px 16px; }
  .ticket-top .flag{ font-size:26px; margin-bottom:10px; display:block;}
  .ticket-top h3{ margin:0 0 4px; font-size:19px; }
  .ticket-top .provider{ font-family:var(--mono); font-size:11px; color:var(--teal); text-transform:uppercase; letter-spacing:0.06em;}
  .ticket-mid{ display:flex; gap:16px; padding:0 22px 18px; }
  .stat{ }
  .stat .num{ font-size:22px; font-weight:800; }
  .stat .lbl{ font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.05em; }
  .tperf{
    border-top:2px dashed var(--line); position:relative; margin:0 0;
  }
  .tperf::before,.tperf::after{
    content:''; position:absolute; top:-10px; width:20px; height:20px; border-radius:50%; background:var(--paper);
  }
  .tperf::before{ left:-10px; } .tperf::after{ right:-10px; }
  .ticket-bottom{
    padding:16px 22px 20px; display:flex; justify-content:space-between; align-items:center; background:var(--paper-dim);
  }
  .price{ font-size:22px; font-weight:800; }
  .price span{ font-size:12px; color:var(--ink-soft); font-weight:500; }
  .buy-btn{
    background:var(--gold); color:var(--ink); border:none; border-radius:8px;
    padding:10px 18px; font-weight:700; font-size:13px; cursor:pointer;
  }
  .buy-btn:hover{ filter:brightness(0.95); }

  /* ---------- TRUST BAR ---------- */
  .trust{ padding:10px 6vw 70px; }
  .trust-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:12px; overflow:hidden;
  }
  .trust-item{ background:var(--paper); padding:22px 20px; text-align:center; }
  .trust-num{ font-family:var(--mono); font-size:24px; font-weight:800; color:var(--ink); }
  .trust-lbl{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; }

  footer{ padding:26px 6vw; border-top:1px solid var(--line); }
  .footer-inner{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .footer-brand{ font-weight:700; font-size:13px; }
  .footer-links{ font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:8px; }
  .footer-links a{ color:var(--ink-soft); text-decoration:none; }
  .footer-links a:hover{ color:var(--gold); }
  .footer-dot{ opacity:.5; }

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(22,35,63,0.55); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:#fff; border-radius:16px; width:min(420px,100%); overflow:hidden;
    box-shadow:0 30px 60px rgba(22,35,63,0.3);
  }
  .modal-head{ padding:20px 24px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .modal-head h3{ margin:0; font-size:16px; }
  .modal-close{ background:none; border:none; font-size:18px; cursor:pointer; color:var(--ink-soft); }
  .modal-body{ padding:24px; }
  .modal-body label{ display:block; font-size:12.5px; font-weight:600; margin:14px 0 6px; }
  .modal-body input{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:8px; font-size:14px; font-family:inherit;
  }
  .modal-summary{ background:var(--paper-dim); border-radius:10px; padding:14px 16px; margin-bottom:6px; }
  .modal-summary .row{ display:flex; justify-content:space-between; font-size:13px; padding:3px 0; color:var(--ink-soft);}
  .modal-summary .row.total{ color:var(--ink); font-weight:700; font-size:15px; border-top:1px solid var(--line); margin-top:6px; padding-top:10px;}
  .modal-footer{ padding:0 24px 24px; }
  .full-btn{ width:100%; }
  .result{ text-align:center; padding:10px 0 4px; }
  .result .check{
    width:52px; height:52px; border-radius:50%; background:var(--teal); color:#fff; display:flex;
    align-items:center; justify-content:center; margin:0 auto 16px; font-size:24px;
  }
  .qr-real{
    width:150px; height:150px; margin:0 auto 14px; border-radius:10px;
    background:
      repeating-linear-gradient(90deg, var(--ink) 0 7px, transparent 7px 14px),
      repeating-linear-gradient(0deg, var(--ink) 0 7px, transparent 7px 14px);
    background-blend-mode:multiply; background-color:#fff; border:1px solid var(--line);
  }
  .lpa-code{
    font-family:var(--mono); font-size:11px; background:var(--paper-dim); padding:10px 12px; border-radius:8px;
    word-break:break-all; color:var(--ink-soft);
  }
  @media(max-width:860px){
    .hero{ grid-template-columns:1fr; }
    .trust-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark"></div>
    <div class="logo-text">連線登機證 <span>· eSIM</span></div>
  </div>
  <nav>
    <a href="#shop">選購方案</a>
  </nav>
</header>

<section class="hero">
  <div>
    <div class="eyebrow">日本 · 韓國 · 東南亞</div>
    <h1>你的旅程，<em>一張連線登機證</em>解決</h1>
    <p>選方案、付款、掃碼開通，三步驟搞定出國上網。付款完成後最快 30 秒收到可用的 eSIM，QR Code 同步寄到你的信箱，隨時找得回來。</p>
    <div class="hero-actions">
      <button class="btn btn-primary" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">瀏覽方案</button>
    </div>
  </div>
  <div class="stub-preview">
    <div class="row"><span>Boarding · Data</span><span>ESM-2607</span></div>
    <div class="route">TPE → NRT</div>
    <div class="sub">10GB · 30 天 · 4G/5G</div>
    <div class="perf"></div>
    <div class="meta">
      <div>PLAN<strong>日本長天期</strong></div>
      <div>STATUS<strong style="color:var(--gold)">ACTIVE</strong></div>
      <div class="qr-mock"></div>
    </div>
  </div>
</section>

<section class="shop" id="shop">
  <div class="shop-head">
    <h2>選擇你的目的地方案</h2>
    <div class="tabs">
      <button class="tab active" data-region="jp">🇯🇵 日本</button>
      <button class="tab" data-region="kr">🇰🇷 韓國</button>
      <button class="tab" data-region="sea">🌏 東南亞</button>
    </div>
  </div>
  <div class="grid" id="planGrid"></div>
</section>

<section class="trust" id="trust">
  <div class="trust-grid">
    <div class="trust-item">
      <div class="trust-num">30 秒</div>
      <div class="trust-lbl">付款完成後平均出票時間</div>
    </div>
    <div class="trust-item">
      <div class="trust-num">24 小時</div>
      <div class="trust-lbl">客服信箱回覆</div>
    </div>
    <div class="trust-item">
      <div class="trust-num">7 天</div>
      <div class="trust-lbl">未啟用可申請退款</div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="footer-brand">連線登機證 <span style="color:var(--teal)">· eSIM</span></div>
    <div class="footer-links">
      <a href="mailto:support@yourshop.example">客服信箱</a>
      <span class="footer-dot">·</span>
      <span>© 2026 連線登機證</span>
    </div>
  </div>
</footer>

<!-- ORDER MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">確認訂單</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
const PLANS = {
  jp: [
    {id:'jp_5gb_8d', flag:'🇯🇵', name:'日本標準流量', provider:'eSIM Access 批發', gb:'5GB', days:'8天', price:180},
    {id:'jp_10gb_30d', flag:'🇯🇵', name:'日本長天期', provider:'eSIM Access 批發', gb:'10GB', days:'30天', price:390},
    {id:'jp_unlimited_15d', flag:'🇯🇵', name:'日本吃到飽', provider:'eSIM Go 批發', gb:'不限量(FUP 2GB/日)', days:'15天', price:450},
  ],
  kr: [
    {id:'kr_5gb_8d', flag:'🇰🇷', name:'韓國標準流量', provider:'eSIM Access 批發', gb:'5GB', days:'8天', price:170},
    {id:'kr_10gb_20d', flag:'🇰🇷', name:'韓國長天期', provider:'eSIM Go 批發', gb:'10GB', days:'20天', price:360},
    {id:'kr_unlimited_10d', flag:'🇰🇷', name:'韓國吃到飽', provider:'eSIM Access 批發', gb:'不限量(FUP 1.5GB/日)', days:'10天', price:400},
  ],
  sea: [
    {id:'sea_10gb_30d', flag:'🌏', name:'東南亞多國通用', provider:'eSIM Go 批發', gb:'10GB', days:'30天', price:420},
    {id:'th_5gb_15d', flag:'🇹🇭', name:'泰國單國流量', provider:'eSIM Access 批發', gb:'5GB', days:'15天', price:220},
    {id:'vn_5gb_15d', flag:'🇻🇳', name:'越南單國流量', provider:'eSIM Access 批發', gb:'5GB', days:'15天', price:210},
  ],
};

const grid = document.getElementById('planGrid');
function renderPlans(region){
  grid.innerHTML = '';
  PLANS[region].forEach(p=>{
    const el = document.createElement('div');
    el.className = 'ticket';
    el.innerHTML = `
      <div class="ticket-top">
        <span class="flag">${p.flag}</span>
        <h3>${p.name}</h3>
        <div class="provider">${p.provider}</div>
      </div>
      <div class="ticket-mid">
        <div class="stat"><div class="num">${p.gb}</div><div class="lbl">流量</div></div>
        <div class="stat"><div class="num">${p.days}</div><div class="lbl">效期</div></div>
      </div>
      <div class="tperf"></div>
      <div class="ticket-bottom">
        <div class="price">NT$${p.price}<span> /張</span></div>
        <button class="buy-btn">立即購買</button>
      </div>
    `;
    el.querySelector('.buy-btn').onclick = ()=>openOrder(p);
    grid.appendChild(el);
  });
}
renderPlans('jp');

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    renderPlans(t.dataset.region);
  };
});

// ---- Modal / mock checkout flow ----
const overlay = document.getElementById('overlay');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');
const modalFooter = document.getElementById('modalFooter');

function openOrder(plan){
  modalTitle.textContent = '確認訂單';
  modalBody.innerHTML = `
    <div class="modal-summary">
      <div class="row"><span>${plan.flag} ${plan.name}</span><span>${plan.gb} / ${plan.days}</span></div>
      <div class="row total"><span>應付金額</span><span>NT$${plan.price}</span></div>
    </div>
    <label>Email（用於接收訂單確認信與 QR Code）</label>
    <input type="email" id="orderEmail" placeholder="you@example.com">
  `;
  modalFooter.innerHTML = `<button class="btn btn-primary full-btn" id="payBtn">前往付款</button>`;
  document.getElementById('payBtn').onclick = ()=>payNow(plan);
  overlay.classList.add('show');
}

async function payNow(plan){
  const emailInput = document.getElementById('orderEmail');
  const email = (emailInput && emailInput.value || '').trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    alert('請輸入正確的 Email');
    return;
  }
  modalTitle.textContent = '處理中';
  modalBody.innerHTML = `<div style="text-align:center;padding:30px 0;color:var(--ink-soft);font-size:13px;">
    建立訂單中，即將前往付款頁面…</div>`;
  modalFooter.innerHTML = '';
  try{
    const res = await fetch('/api/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ planId: plan.id, email }),
    });
    if(!res.ok){
      const err = await res.json().catch(()=>({error:'訂單建立失敗，請稍後再試'}));
      throw new Error(err.error || '訂單建立失敗，請稍後再試');
    }
    // /api/checkout returns an auto-submitting HTML form that posts straight
    // to ECPay - replace the whole page with it so the browser follows through.
    const html = await res.text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    modalTitle.textContent = '訂單建立失敗';
    modalBody.innerHTML = `<div style="text-align:center;padding:20px 0;color:var(--red);font-size:13px;">${err.message}</div>`;
    modalFooter.innerHTML = `<button class="btn btn-ghost full-btn" onclick="closeModal()">關閉</button>`;
  }
}

function closeModal(){ overlay.classList.remove('show'); }
overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
</script>
</body>
</html>
